services:
  db:
    image: postgres:15
    container_name: callback-db
    environment:
      POSTGRES_DB: callback_db
      POSTGRES_USER: callback_user
      POSTGRES_PASSWORD: callback_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - callback-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callback_user -d callback_db -t 3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: callback-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: callback_user
      RABBITMQ_DEFAULT_PASS: callback_password
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - callback-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:

networks:
  callback-net:
    driver: bridge
